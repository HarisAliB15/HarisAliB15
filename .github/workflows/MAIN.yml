name: Refresh contribution snake

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/MAIN.yml'
      - '.github/scripts/calendar-year.cjs'
      - '.github/scripts/style-snake.cjs'

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out pinned snake generator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Platane/snk
          ref: d8f6715049803e982ee5ff501b6b9b7d5deeb09b
          path: .snake-tool
          persist-credentials: false
      - name: Generate current calendar year animations
        run: node --require ./.github/scripts/calendar-year.cjs .snake-tool/svg-only/dist/index.js
        env:
          INPUT_GITHUB_USER_NAME: ${{ github.repository_owner }}
          INPUT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_OUTPUTS: |
            assets/github-snake.svg?color_snake=%2314b8a6
            assets/github-snake-dark.svg?palette=github-dark&color_snake=%2367e8c2
      - name: Make the eating effect clearly visible
        run: node .github/scripts/style-snake.cjs
      - name: Save updated animations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-snake.svg assets/github-snake-dark.svg
          if git diff --cached --quiet; then
            echo 'Contribution animation is already current.'
            exit 0
          fi
          git commit -m 'Refresh contribution snake animation'
          git pull --rebase origin main
          git push origin HEAD:main
